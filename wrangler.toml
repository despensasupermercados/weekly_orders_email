name = "weekly-orders-email"
main = "src/index.js"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

# TWO SCHEDULES, one handler, split on event.cron inside scheduled().
#   "0 6 * * *"     nightly 02:00 Miami - the watchdog. Repairs and reports.
#   "0 12 * * MON"  Monday  08:00 Miami - the fleet email.
#
# THE NIGHTLY STRING MUST EQUAL NIGHTLY_CRON IN src/index.js, CHARACTER FOR
# CHARACTER. This trigger was once added here while src/lib/watchdog.js and the
# cron split were still only on a laptop: the result was the WEEKLY EMAIL path
# firing every night. If they ever disagree again, the same thing happens.
#
# THE WEEKLY USES THE NAME "MON", NOT A NUMBER, ON PURPOSE.
# Cloudflare's day-of-week field is 1-7 with 1=SUNDAY (their own reference:
# cloudflare/skills, references/cron-triggers). That is NOT the Unix convention
# most people carry in their head, where 0=Sunday and 1=Monday. "0 12 * * 1"
# therefore scheduled this for SUNDAY, which is what the dashboard's next-run
# line showed. Writing MON removes the off-by-one entirely and survives anyone
# who assumes the Unix base. Cloudflare accepts SUN-SAT names in this field.
#
# All Cloudflare crons are UTC, with no per-worker timezone. 12:00 UTC is 08:00
# Miami on EDT; Miami is EST Nov-Mar, so in winter the weekly lands at 07:00
# local. Leave it - an hour early is harmless, an hour late is not.
[triggers]
crons = ["0 6 * * *", "0 12 * * MON"]

[[d1_databases]]
binding = "HON"
database_name = "cims-hon"
database_id = "7b4387c8-c611-45f8-a2e8-58061989f833"

[[d1_databases]]
binding = "ORDERS"
database_name = "cims-order"
database_id = "8a755d27-d679-4bdf-a53b-c210a4206fa7"

# READ ONLY. cims-mailer's log of every send, with Resend's delivery verdict
# (delivered / delayed / bounced / complained) written back by webhook. The
# night check reads the Monday batch out of it and names any ship whose email
# did not land. This Worker never writes to it: mail_log belongs to cims-mailer.
[[d1_databases]]
binding = "MAIL"
database_name = "cims-mail"
database_id = "e2b1da1d-d439-40da-901c-7856c61b2d0c"

# TRANSPORT: service binding, per the CIMS email standard section 4. cims-mailer
# holds the ONLY Resend key in the estate and reads no Authorization header.
# There is NO MAILER_URL and NO MAILER_TOKEN - do not add them back. A Resend key
# was once pasted into a plaintext Worker variable here because this binding was
# missing and the code invented a URL+token interface that does not exist.
[[services]]
binding = "MAILER"
service = "cims-mailer"

[vars]
# LIVE. Miguel, 15 Sep 2026: "the one who has all the ships will go to
# onboardsupport; the individual ships will go to each ship and cc Ray on each
# of the emails - so Ray will receive 50 emails on Monday. Wire them all."
# Set this back to "false" and the Monday run sends the whole-fleet list to
# DRY_RUN_TO only. One line, no code change.
SEND_TO_FLEET = "true"

# WHO GETS WHAT. Four audiences, deliberately separated.
#   FLEET_TO    - the whole-fleet email, every Monday, live.
#   SHIP_CC     - copied on EVERY per-ship email. Ray, so he sees what each
#                 ship was told, in the same message the ship got.
#   DRY_RUN_TO  - the whole-fleet email while SEND_TO_FLEET is "false".
#   REPLY_TO    - where a crew's reply lands. The mail is FROM cims@cims.work,
#                 which no person reads; a printer who hits reply reaches Ray.
#   WATCHDOG_TO - the night check, Miguel only. See below.
FLEET_TO = "onboardsupport@DG3.com"
SHIP_CC = "Ray.Guerra@dg3.com"
REPLY_TO = "Ray.Guerra@dg3.com"
DRY_RUN_TO = "Miguel.Sanmartin@dg3.com,Ray.Guerra@dg3.com"

# THE NIGHT CHECK EMAILS MIGUEL AGAIN - BUT ONLY WHAT IS NEW.
#
# Miguel emptied this on 10 Sep 2026, after the first digest ever sent, and
# the reason was right: the watchdog HAD NO STATE. It could not tell that it
# said the same thing yesterday, so a standing condition (Allure's schedule
# ended, 21 of 48 ships covered) would have arrived nightly forever, and a
# nightly mail that always arrives is one that gets filtered. A nightly Claude
# session reading /watchdog was to raise only what was new.
#
# What that cost, 11-16 Sep 2026: the night check flagged the OBP feed as
# frozen every night from the first night (feed_frozen, critical from night
# five), logged "WATCHDOG_TO is empty. Findings logged, nothing sent." and
# nobody heard. The outside reader did not raise it. Six days of every quantity
# in the email computed from 10 September stock.
#
# So the Worker now remembers (src/lib/watchdog.js rememberFindings, table
# weekly_watchdog_seen): a finding is mailed the night it FIRST appears, is
# quiet every night after, and a CRITICAL one still standing a week later is
# mentioned again once a week. The digest marks each line NEW or STILL
# STANDING. "Nothing new since last night" is logged, not mailed.
#
# Engineering only. Never Ray, never a ship.
WATCHDOG_TO = "Miguel.Sanmartin@dg3.com"

# PER-SHIP ADDRESSING. "Ship = address, address; Ship = address", newlines and
# # comments allowed. An address is used ONLY if it appears here. Nothing in the
# code derives a mailbox from a ship name: a guessed address either bounces,
# which is useless, or lands in a real stranger's inbox carrying another
# company's operational data, which is worse.
#
# A ship due this week with no entry here is NOT dropped - its rows go to
# DRY_RUN_TO flagged as undeliverable, and the night check reports it.
#
# Read GET /fleet before setting SEND_TO_FLEET to true. It prints exactly which
# ship would receive which address and which ships cannot be reached at all.
#
# SOURCE OF EVERY LINE BELOW: cims-timecard D1, table ship_contact, roles
# printer_specialist (Royal), printer (Celebrity), printer_manager (Azamara).
